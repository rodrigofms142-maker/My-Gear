<style>
:root{--bg:#080b05;--card:rgba(14,19,9,.7);--ink:#f2ecd8;--mut:#a9ad92;--acc:#d6b55c;--onacc:#16190d;--warn:#ec8a50;--line:rgba(214,181,92,.24);--fog:178,192,152;--mono:"Space Mono",ui-monospace,Menlo,monospace;--disp:Oswald,Impact,"Arial Narrow",sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#1b260d 0,#0e1409 45%,#080b05 100%) fixed;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,label,h2{touch-action:manipulation}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:46vh}
#scene .far{opacity:.55}
.fg{position:absolute;left:-40%;width:180%;height:24vh;background:radial-gradient(ellipse at center,rgba(var(--fog),.3),transparent 68%);animation:dr 52s ease-in-out infinite alternate;will-change:transform}
.f1{bottom:36vh}.f2{bottom:20vh;animation-duration:68s;animation-direction:alternate-reverse;opacity:.9}.f3{bottom:4vh;animation-duration:44s}
@keyframes dr{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
@keyframes pl{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.fg,.tag i,.mist{animation:none}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 14px 40px}
.hero{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(30,42,15,.9),rgba(11,16,7,.92));box-shadow:0 14px 34px rgba(0,0,0,.4)}
.hr{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;z-index:-1}
.mist{position:absolute;left:-30%;right:-30%;bottom:-6%;height:60%;z-index:-1;background:radial-gradient(ellipse at center,rgba(var(--fog),.34),transparent 70%);animation:dr 40s ease-in-out infinite alternate}
.top{display:flex;align-items:center;gap:14px}
.logo{position:relative;width:96px;height:96px;flex:none}
.logo img{position:absolute;inset:7px;width:82px;height:82px;border-radius:50%}
.logo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.logo circle{fill:none;stroke-width:3}
.trk{stroke:rgba(214,181,92,.22)}
.arc{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:295.31;stroke-dashoffset:295.31;transition:stroke-dashoffset .4s;filter:drop-shadow(0 0 4px rgba(214,181,92,.6))}
.tag{display:flex;align-items:center;gap:7px;font:700 .6rem/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.tag i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pl 2s infinite}
.hero h1{margin:6px 0 4px;font:900 clamp(2.8rem,15vw,3.9rem)/.9 "Big Shoulders Display",var(--disp);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:baseline;gap:.2em}
.hero h1 i{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--acc)}
.hero h1 b{font-weight:900;background:linear-gradient(180deg,#fff7dc,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font:.72rem var(--mono);color:#b9b79f;letter-spacing:.1em}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hud div{border:1px solid rgba(214,181,92,.32);background:rgba(8,11,5,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:10px 4px;text-align:center}
.hud b{display:block;font:700 1.25rem/1 var(--disp);color:#fff7dc;white-space:nowrap}
.hud small{font:.56rem var(--mono);letter-spacing:.14em;color:var(--acc)}
.bar{position:relative;height:12px;margin-top:14px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.09)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7330,var(--acc));transition:width .3s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(8,11,5,.6) 8px 10px)}
.sub{color:var(--mut);font-size:.86rem;margin:12px 2px 0}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:env(safe-area-inset-top,0px);padding:6px 0;z-index:3;background:linear-gradient(180deg,rgba(8,11,5,.94),rgba(8,11,5,.7));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ctl{display:flex;gap:6px;margin:0 0 12px}
.ctl button{flex:1;padding:8px;border:1px solid var(--line);background:none;color:var(--mut);border-radius:999px;font:.68rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
section{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
h2{display:flex;align-items:center;gap:9px;font:700 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0;padding:14px;cursor:pointer;user-select:none}
h2 .c{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;color:var(--mut);font-size:.74rem}
.ch{display:inline-block;transition:transform .15s;font-size:.8rem}
.closed .ch{transform:rotate(-90deg)}
.closed .it{display:none}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.it label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer}
.it input{width:24px;height:24px;accent-color:var(--acc);flex:none}
.it.done{background:linear-gradient(90deg,rgba(214,181,92,.26),rgba(214,181,92,.07));box-shadow:inset 3px 0 0 var(--acc)}
.it.done span{color:#fff7dc;font-weight:600}
.buy{border-left:3px solid var(--warn)}
.buy .nm{flex:1}
.pr{font:.78rem var(--mono);color:var(--warn);white-space:nowrap}
.it button{border:1px solid var(--warn);color:var(--warn);background:none;border-radius:999px;padding:6px 11px;font:.66rem var(--mono);text-transform:uppercase;letter-spacing:.06em}
.foot{margin-top:16px}
.foot button{width:100%;padding:12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:.72rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.empty{padding:14px;color:var(--mut);font-size:.9rem}
</style></head>

["Corta-vento / impermeável (ela)",1,0],
["Calças (ela)",1,0],
["Calções (ela)",1,0],
["Base layer (ela)",1,0],
["Roupa interior (ela)",1,0],
["Meias (ela)",1,0],
["Roupa de tenda (ela)",1,0],
["Chapéu (ela)",1,0],
["Gola (ela)",1,0],
["Luvas (ela)",1,0],
["Calçado de trekking (ela)",1,0]]],
["Comida",[
["Pequeno-almoço (aveia, muesli, leite em pó)",1,0],
["Almoços (pão/tortilhas, queijo, enchidos)",1,0],
["Jantares (massa, arroz, liofilizados)",1,0],
["Sopas / caldos",1,0],
["Snacks (frutos secos, barras energéticas)",1,0],
["Sal / eletrólitos",1,0],
["Café / chá",1,0]]]
];
const K="trek-v2";let S={pack:{},bought:{}},F="all";
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.closed=S.closed||{};const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const eur=n=>n.toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const $=id=>document.getElementById(id);
function render(){
let own=0,packed=0,miss=0,cost=0,html="";
D.forEach((g,gi)=>{
let rows="",so=0,sp=0,sm=0;
g[1].forEach(it=>{
const id=it[0],has=it[1]||S.bought[id],pk=!!S.pack[id];
if(has){own++;so++;if(pk){packed++;sp++}}else{miss++;sm++;cost+=it[2]}
if(F==="pack"&&(!has||pk))return;
if(F==="buy"&&has)return;
if(has)rows+=`<div class="it${pk?" done":""}"><label><input type="checkbox" data-id="${id}"${pk?" checked":""}><span>${it[0]}</span></label></div>`;
else rows+=`<div class="it buy"><span class="nm">${it[0]}</span><span class="pr">${eur(it[2])}</span><button data-b="${id}">Comprei</button></div>`;
});
if(rows)html+=`<section class="${S.closed[gi]?"closed":""}"><h2 data-s="${gi}"><span class="ch">▾</span><span>${g[0]}</span><span class="c">${sp}/${so}${sm?" · "+sm+" a comprar":""}</span></h2>${rows}</section>`;
});
$("list").innerHTML=html||'<div class="empty">Nada por aqui 🎉</div>';
const pct=own?packed/own:0;$("pb").style.width=pct*100+"%";$("pc").style.strokeDashoffset=295.31*(1-pct);
$("hp").textContent=packed+"/"+own;$("hb").textContent=miss;$("hc").textContent=eur(cost);
}
$("list").addEventListener("click",e=>{
const t=e.target,h=t.closest("h2");
if(h){const k=h.dataset.s;S.closed[k]?delete S.closed[k]:S.closed[k]=1;save();render()}
else if(t.dataset.b){S.bought[t.dataset.b]=1;save();render()}
else if(t.dataset.id){t.checked?S.pack[t.dataset.id]=1:delete S.pack[t.dataset.id];save();render()}
});
$("tabs").addEventListener("click",e=>{
if(!e.target.dataset.f)return;F=e.target.dataset.f;
[...$("tabs").children].forEach(b=>b.classList.toggle("on",b===e.target));render()});
$("oa").onclick=()=>{S.closed={};save();render()};
$("ca").onclick=()=>{D.forEach((g,i)=>S.closed[i]=1);save();render()};

$("reset").onclick=()=>{S.pack={};save();render()};
render();

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
