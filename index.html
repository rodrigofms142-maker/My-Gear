<style>
:root{--bg:#080b05;--card:rgba(14,19,9,.7);--ink:#f2ecd8;--mut:#a9ad92;--acc:#d6b55c;--onacc:#16190d;--warn:#ec8a50;--line:rgba(214,181,92,.24);--fog:178,192,152;--mono:"Space Mono",ui-monospace,Menlo,monospace;--disp:Oswald,Impact,"Arial Narrow",sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#1b260d 0,#0e1409 45%,#080b05 100%) fixed;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,label,h2{touch-action:manipulation}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:46vh}
#scene .far{opacity:.55}
.fg{position:absolute;left:-40%;width:180%;height:24vh;background:radial-gradient(ellipse at center,rgba(var(--fog),.3),transparent 68%);animation:dr 52s ease-in-out infinite alternate;will-change:transform}
.f1{bottom:36vh}.f2{bottom:20vh;animation-duration:68s;animation-direction:alternate-reverse;opacity:.9}.f3{bottom:4vh;animation-duration:44s}
@keyframes dr{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
@keyframes pl{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.fg,.tag i,.mist{animation:none}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 14px 40px}
.hero{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;background:linear-gradient(180deg,rgba(30,42,15,.9),rgba(11,16,7,.92));box-shadow:0 14px 34px rgba(0,0,0,.4)}
.hr{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;z-index:-1}
.mist{position:absolute;left:-30%;right:-30%;bottom:-6%;height:60%;z-index:-1;background:radial-gradient(ellipse at center,rgba(var(--fog),.34),transparent 70%);animation:dr 40s ease-in-out infinite alternate}
.top{display:flex;align-items:center;gap:14px}
.logo{position:relative;width:96px;height:96px;flex:none}
.logo img{position:absolute;inset:7px;width:82px;height:82px;border-radius:50%}
.logo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.logo circle{fill:none;stroke-width:3}
.trk{stroke:rgba(214,181,92,.22)}
.arc{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:295.31;stroke-dashoffset:295.31;transition:stroke-dashoffset .4s;filter:drop-shadow(0 0 4px rgba(214,181,92,.6))}
.tag{display:flex;align-items:center;gap:7px;font:700 .6rem/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.tag i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pl 2s infinite}
.hero h1{margin:6px 0 4px;font:900 clamp(2.8rem,15vw,3.9rem)/.9 "Big Shoulders Display",var(--disp);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:baseline;gap:.2em}
.hero h1 i{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--acc)}
.hero h1 b{font-weight:900;background:linear-gradient(180deg,#fff7dc,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font:.72rem var(--mono);color:#b9b79f;letter-spacing:.1em}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hud div{border:1px solid rgba(214,181,92,.32);background:rgba(8,11,5,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:10px 4px;text-align:center}
.hud b{display:block;font:700 1.25rem/1 var(--disp);color:#fff7dc;white-space:nowrap}
.hud small{font:.56rem var(--mono);letter-spacing:.14em;color:var(--acc)}
.bar{position:relative;height:12px;margin-top:14px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.09)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7330,var(--acc));transition:width .3s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(8,11,5,.6) 8px 10px)}
.sub{color:var(--mut);font-size:.86rem;margin:12px 2px 0}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:env(safe-area-inset-top,0px);padding:6px 0;z-index:3;background:linear-gradient(180deg,rgba(8,11,5,.94),rgba(8,11,5,.7));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ctl{display:flex;gap:6px;margin:0 0 12px}

const K="trek-v2";

try{const r=localStorage.getItem(K);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
for(const k of ["pack","bought","closed","info","notes","hidden","notown","price","nm","sec","bag","modN"])S[k]=S[k]||{};
if(!Array.isArray(S.mods)||!S.mods.length)S.mods=D.map(g=>g[0]);
[...(S.items||[]).map(x=>x[0]),...Object.values(S.sec)].forEach(n=>{if(n&&!S.mods.includes(n))S.mods.push(n)});
S.items=S.items||[];S.view="cat";

const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const nm=id=>S.nm[id]||id;
const bagName=id=>{const b=S.bags.find(x=>x.id===id);return b?b.name:""};
const modName=id=>S.modN[id]||id;
const secs=()=>{const m=new Map(S.mods.map(id=>[id,[]]));
const all=[];D.forEach(g=>g[1].forEach(it=>all.push([g[0],it])));S.items.forEach(x=>all.push([x[0],x.slice(1)]));
all.forEach(([s,it])=>{let e=S.sec[it[0]]||s;if(!m.has(e))e=S.mods[0];m.get(e).push(it)});return[...m]};
const find=id=>{for(const[s,items]of secs())for(const it of items)if(it[0]===id)return{it,sec:s};return null};
const owned=(id,it)=>S.notown[id]?0:((it[1]||S.bought[id])?1:0);
function entries(){const o=[];secs().forEach(([sec,items])=>items.forEach(it=>{const id=it[0];if(S.hidden[id])return;o.push({id,it,sec,has:owned(id,it),pr:S.price[id]??it[2]})}));return o}

const P={};let db=null;
const idbOpen=()=>new Promise(res=>{try{const q=indexedDB.open("mygear",1);q.onupgradeneeded=()=>q.result.createObjectStore("ph");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});
const loadPh=()=>new Promise(res=>{if(!db)return res();try{const t=db.transaction("ph"),r=t.objectStore("ph").openCursor();r.onsuccess=()=>{const c=r.result;if(c){P[c.key]=URL.createObjectURL(c.value);c.continue()}};t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
const setPh=(id,blob)=>new Promise(res=>{if(P[id])URL.revokeObjectURL(P[id]);P[id]=URL.createObjectURL(blob);if(!db)return res();try{const t=db.transaction("ph","readwrite");t.objectStore("ph").put(blob,id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
const delPh=id=>new Promise(res=>{delete P[id];if(!db)return res();try{const t=db.transaction("ph","readwrite");t.objectStore("ph").delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
const shrink=(file,max,q)=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Imagem inválida")),"image/jpeg",q)};im.onerror=()=>rej(new Error("Não consegui ler a imagem"));im.src=u});
/* ---------- agrupar e desenhar a lista ---------- */
function groups(E){
if(S.view==="bag"){
const ids=new Set(S.bags.map(b=>b.id));
const g=S.bags.map(b=>({key:"bag:"+b.id,title:b.name,bagId:b.id,bag:1,items:E.filter(e=>e.has&&S.bag[e.id]===b.id)}));

g.push({key:"bag:buy",title:"Por comprar",items:E.filter(e=>!e.has)});
return g}
const m=new Map(secs().map(([n])=>[n,[]]));E.forEach(e=>m.get(e.sec).push(e));
return[...m].map(([n,items])=>({key:n,title:modName(n),items,mod:1}));
}
function render(){
const E=entries();let own=0,packed=0,miss=0,cost=0;
E.forEach(e=>{if(e.has){own++;if(S.pack[e.id])packed++}else{miss++;cost+=e.pr||0}});
let html="";
groups(E).forEach(g=>{
if(g.bagId){if(F==="buy")return;const tot=g.items.length,pk=g.items.filter(e=>S.pack[e.id]).length;
html+=`<button class="bagc" data-bag="${esc(g.bagId)}"><span class="bt"><span class="bn">${esc(g.title)}</span><span class="bc">${pk}/${tot} dentro</span></span><span class="bar"><i style="width:${tot?pk/tot*100:0}%"></i></span><svg class="bch" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`;return}
let rows="",so=0,sp=0,sm=0;
g.items.forEach(({id,has,pr})=>{
const pk=!!S.pack[id];
if(has){so++;if(pk)sp++}else sm++;
if(F==="pack"&&(!has||pk))return;
if(F==="buy"&&has)return;
const e=esc(id),n=esc(nm(id)),th=P[id]?`<button class="th" data-d="${e}" aria-label="Detalhes" style="background-image:url('${P[id]}')"></button>`:`<button class="i" data-d="${e}" aria-label="Detalhes">ⓘ</button>`;
if(has)rows+=`<div class="it${pk?" done":""}"><label><input type="checkbox" data-id="${e}"${pk?" checked":""}><span>${n}</span></label>${th}</div>`;
else rows+=`<div class="it buy"><span class="nm" data-d="${e}">${n}</span><span class="pr">${pr!=null?eur(pr):"s/ preço"}</span><button data-b="${e}">Comprei</button>${th}</div>`;
});
if(!rows&&g.mod&&F==="all"&&!g.items.length)rows='<div class="it"><span class="mut">Vazio — toca em + para adicionar itens.</span></div>';
if(!rows&&g.bag&&F==="all"&&!g.items.length)rows='<div class="it"><span class="mut">Vazia — usa Vou sair! para escolher itens.</span></div>';
const cnt=g.key==="bag:buy"?g.items.length+" itens":`${sp}/${so}${(!g.bag&&sm)?" · "+sm+" a comprar":""}`;
if(rows)html+=`<section class="${S.closed[g.key]?"closed":""}"><h2 data-s="${esc(g.key)}"><span class="ch">▾</span><span>${esc(g.title)}</span><span class="c">${cnt}</span></h2>${rows}</section>`;
});
html+='<div class="btns mb"><button class="b2" data-addmod="1">+ Novo módulo</button><button class="b2" data-editmods="1">Editar módulos</button></div>';
$("list").innerHTML=html||'<div class="empty">Nada por aqui</div>';
if(typeof pages!=="undefined"&&pages.length){drawVs();drawGo();drawPg()}
const pct=own?packed/own:0;$("pb").style.width=pct*100+"%";$("pc").style.strokeDashoffset=295.31*(1-pct);
$("hp").textContent=packed+"/"+own;$("hb").textContent=miss;$("hc").textContent=eur(cost);
}

const t=e.target,h=t.closest("h2"),d=t.closest("[data-d]"),am=t.closest("[data-addmod]"),em=t.closest("[data-editmods]");

/* ---------- adicionar (sem IA: detecta preço, secção e estado a partir do texto) ---------- */
const KW=[["Mochilas","mochila|bolsa de agua|bastao|bastoes|capa de chuva|estanque"],["Roupa","casaco|fleece|corta.?vento|jaqueta|calcas|calcoes|t.?shirt|camisola|base layer|interior|cuecas|boxers|meias|gola|luvas|chapeu|bone|gorro|calcado|botas|sapatilhas|impermeavel|pluma|colete"],["Iluminação","lanterna|frontal|pilhas"],["Ferramentas","faca|canivete|isqueiro|fosforo|corda|paracord|fita|bussola|apito|power ?bank|carregador|cabo|manta de sobrevivencia|gps|relogio|mapa"],["Higiene & Saúde","primeiros socorros|solar|protetor|escova|pasta de dentes|toalhita|papel higienico|desodorizante|sabonete|repelente|pensos|medicamento"],["Abrigo & Sono","tenda|saco.?cama|sacos|colchao|tapete|manta|almofada|isolante|estacas|piquetes|alpendre"],["Água & Cozinha","filtro|fogareiro|panela|gas|cartucho|garrafa|cantil|talher|caneca|copo|cozinha|agua"],["Comida","comida|aveia|muesli|massa|arroz|sopa|snack|barra|frutos secos|cafe|cha|sal|liofilizado|pao|queijo|enchido|leite"]];
const PRICE=/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os)?\b)|€\s*(\d+(?:[.,]\d{1,2})?)/i;
function parseQ(raw){
const t=nz(raw),r={name:"",price:null,have:null,section:null};
const m=raw.match(PRICE);if(m)r.price=parseFloat((m[1]||m[2]).replace(",","."));
r.have=/\bnao tenho|falta|comprar|quero|preciso/.test(t)?false:(/\btenho|comprei/.test(t)?true:null);
for(const[s,p]of KW){if(p.split("|").some(k=>new RegExp("\\b"+k+(k.length<=4?"\\b":"")).test(t))){r.section=s==="Roupa"?(/marisa|\bela\b|dela/.test(t)?"Roupa Marisa":"Roupa Moreira"):s;break}}
let n=raw.replace(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os)?\b)/ig,"").replace(/€\s*\d+(?:[.,]\d{1,2})?/g,"").replace(/\b(j[áa] tenho|n[ãa]o tenho|j[áa] comprei|tenho|comprei|falta comprar|falta|comprar|quero|preciso)\b/ig,"").replace(/[,;–—-]+\s*(?=[,;–—-]|$)/g,"").replace(/\s{2,}/g," ").replace(/^[\s,;–—-]+|[\s,;–—-]+$/g,"");
r.name=n.charAt(0).toUpperCase()+n.slice(1);return r;
}
function addItem(o){
const name=String(o.name||"Novo item").trim()||"Novo item";let n=name,k=2;while(find(n))n=name+" ("+(k++)+")";
const sec=String(o.section||"Outros").trim()||"Outros";if(!S.mods.includes(sec))S.mods.push(sec);
const p=(o.price===null||o.price===undefined||o.price==="")?null:Number(o.price);
S.items.push([sec,n,o.have?1:0,(p===null||isNaN(p))?null:p]);save();return n;
}

sheet(`<h3>Adicionar item</h3>

<p class="mut s">Escreve o nome. Detecto o preço (85€), o estado (“já tenho” / “falta”) e a secção — podes corrigir abaixo.</p>

<h4>Módulo</h4><select id="qs">${secs().map(([n])=>`<option value="${esc(n)}">${esc(modName(n))}</option>`).join("")}<option value="__n">+ Novo módulo…</option></select><input id="qns" placeholder="Nome do novo módulo" hidden>
<h4>Preço (€)</h4><input id="qp" type="number" step="0.01" inputmode="decimal" placeholder="opcional">
<label class="chk"><input id="qh" type="checkbox"> Já tenho</label>
<button class="go" id="qgo">Adicionar</button><p class="msg" id="qmsg"></p>`,()=>{
$("qa").oninput=()=>{const r=parseQ($("qa").value);
if(!dirty.s&&r.section&&[...$("qs").options].some(o=>o.value===r.section))$("qs").value=r.section;
if(!dirty.p&&r.price!==null)$("qp").value=r.price;
if(!dirty.h&&r.have!==null)$("qh").checked=r.have};
$("qs").onchange=()=>{dirty.s=1;$("qns").hidden=$("qs").value!=="__n"};
$("qp").oninput=()=>dirty.p=1;$("qh").onchange=()=>dirty.h=1;
$("qf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{ph1=await shrink(f,720,.75);$("qpv").innerHTML='<img alt="" src="'+URL.createObjectURL(ph1)+'">'}catch(err){say("qmsg",err.message,1)}};
$("qgo").onclick=async()=>{
const r=parseQ($("qa").value);if(!r.name)return say("qmsg","Escreve o nome do item.",1);
let sec=$("qs").value;if(sec==="__n")sec=addMod($("qns").value.trim()||"Novo módulo");
const n=addItem({name:r.name,section:sec,have:$("qh").checked,price:$("qp").value});
if(ph1)await setPh(n,ph1);
render();closeS();openD(n)};
$("qa").focus();
});

function essCheck(E,ids){

if(!E.length)h=none?'<p class="mut">Todos os itens já têm mochila.</p>':'<p class="mut">Mochila vazia. Toca em “Adicionar itens”.</p>';
else if(none)h=`<section><h2 class="static"><span>Por organizar</span><span class="c">${E.length}</span></h2>${E.map(row).join("")}</section>`;
else{if(falta.length)h+=`<section><h2 class="static"><span>Falta meter</span><span class="c">${falta.length}</span></h2>${falta.map(row).join("")}</section>`;
if(dentro.length)h+=`<section><h2 class="static"><span>Já dentro</span><span class="c">${dentro.length}</span></h2>${dentro.map(row).join("")}</section>`}
$("pgl").innerHTML=h;$("pga").hidden=!selMode;$("pgsn").textContent=sel.size;
}
function moveSheet(ids){
const E=entries();
sheet(`<h3>Mover ${ids.length>1?ids.length+" itens":"item"}</h3><p class="mut">${ids.length===1?esc(nm(ids[0])):"Escolhe a mochila de destino."}</p><div id="mvl">${S.bags.filter(b=>b.id!==PG).map(b=>`<button class="mvb" data-to="${esc(b.id)}"><span>${esc(b.name)}</span><small>${E.filter(e=>e.has&&S.bag[e.id]===b.id).length} itens</small></button>`).join("")}${PG==="none"?"":'<button class="mvb" data-to=""><span>Retirar da mochila</span><small>sem mochila</small></button>'}</div>`,()=>{
$("mvl").onclick=e=>{const b=e.target.closest("[data-to]");if(!b)return;ids.forEach(id=>{b.dataset.to?S.bag[id]=b.dataset.to:delete S.bag[id];delete S.pack[id]});sel=new Set();selMode=false;save();render();closeS()}});
}
$("pgb").onclick=back;$("vsk").onclick=back;$("gok").onclick=back;$("gobtn").onclick=()=>pushPage({id:"go"});
$("pgs").onclick=()=>{selMode=!selMode;sel=new Set();drawPg()};
$("pgad").onclick=()=>{curBag=PG;openSair()};
$("pgem").onclick=()=>{const ids=entries().filter(e=>S.bag[e.id]===PG).map(e=>e.id);if(!ids.length||!confirm("Tirar todos os itens desta mochila?"))return;ids.forEach(id=>{delete S.bag[id];delete S.pack[id]});save();render()};
$("pgmv").onclick=()=>{if(sel.size)moveSheet([...sel])};
$("pgrm").onclick=()=>{if(!sel.size)return;sel.forEach(id=>{delete S.bag[id];delete S.pack[id]});sel=new Set();selMode=false;save();render()};
$("pgl").addEventListener("click",e=>{const t=e.target,mv=t.closest("[data-mv]"),d=t.closest("[data-d]");
if(mv)return moveSheet([mv.dataset.mv]);
if(d)return openD(d.dataset.d);
if(t.dataset.pk){t.checked?S.pack[t.dataset.pk]=1:delete S.pack[t.dataset.pk];try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}save();render()}
else if(t.dataset.sel){t.checked?sel.add(t.dataset.sel):sel.delete(t.dataset.sel);drawPg()}});
$("vsl").addEventListener("click",e=>{const c=e.target.closest("[data-bag]");if(c)pushPage({id:"bag",arg:c.dataset.bag})});
$("vsed").onclick=()=>openBags(false);
$("vsrs").onclick=()=>{S.pack={};save();render()};
$("fab").onclick=openAdd;$("sair").onclick=()=>pushPage({id:"vs"});
render();
(async()=>{db=await idbOpen();await loadPh();render()})();

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
